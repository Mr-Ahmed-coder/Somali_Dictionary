services:
  - type: web
    name: english-somali-dictionary-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm --prefix .. ci --omit=dev --workspace dictionary-api
    startCommand: npm start
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 15
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Dictionary Admin
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "200"
      - key: MONGODB_CONNECT_MAX_ATTEMPTS
        value: "5"
      - key: MONGODB_CONNECT_RETRY_MS
        value: "1000"
      - key: MONGODB_SERVER_SELECTION_TIMEOUT_MS
        value: "10000"
      - key: MONGODB_CONNECT_TIMEOUT_MS
        value: "10000"
      - key: MONGODB_SOCKET_TIMEOUT_MS
        value: "30000"
      - key: MONGODB_QUERY_TIMEOUT_MS
        value: "10000"
      - key: SHUTDOWN_TIMEOUT_MS
        value: "10000"
      - key: AI_PROVIDER
        value: disabled
